name: CI

# The product needs a server: the workspace API is what lets several people
# and their agents work one report. A static export cannot run it, so this
# repository no longer publishes one — see docs/DEPLOY.md for the container.
# What CI owes a reader instead is proof the gate is real.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all four projects, strict)
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Production build
        run: pnpm --filter web build

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter web exec playwright test
        env:
          E2E_PORT: "3300"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
