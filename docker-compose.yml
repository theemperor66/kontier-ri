# =============================================================================
# Kontier RI — Dokploy compose (https://ri.kontier.eu)
#
# One service: the Next.js production server from ./Dockerfile. No database,
# no cache, no sidecars — the workspace API is file-backed (one JSON file per
# workspace, atomic writes) and lives entirely on the `workspace-data` volume.
#
# Dokploy usage: create a Compose service, source = this repo, compose path =
# `docker-compose.yml`, then add the domain in the UI (Traefik labels are
# generated by Dokploy — do NOT hand-write them here). Full runbook:
# docs/DEPLOY.md.
#
# -----------------------------------------------------------------------------
# ENVIRONMENT — set these in the Dokploy compose "Environment" field.
# Nothing below is committed; the repo must never contain a real token.
# -----------------------------------------------------------------------------
# REQUIRED to enable the shared-workspace API (without it every
# /api/workspace/* route answers 503 "not configured" and the product stays
# local-first in the browser — a valid, honest deploy mode):
#
#   KONTIER_WORKSPACE_TOKENS
#       Comma-separated table of `token:workspaceId:label` entries.
#       One token = exactly one workspace (lib/server/auth.ts). The label may
#       contain ":" (everything after the second separator is the label).
#       Malformed entries are dropped silently; a duplicated token keeps its
#       first mapping. Tokens are compared as sha256 digests in constant time
#       and are never logged.
#       Example (generate real ones with `openssl rand -hex 32`):
#         KONTIER_WORKSPACE_TOKENS=6f3a…:acme:Acme revenue team,9b1c…:kontier:Internal demo
#
# OPTIONAL (defaults below are already correct for this stack):
#
#   KONTIER_WORKSPACE_GUESTS
#       Guest workspaces (invite link = credential) are ON unless this is set
#       to "off". POST /api/workspace/guest is the one unauthenticated,
#       disk-allocating route: capped at 500 live guests, 30 creations per
#       hour per process, 30-day TTL (lib/server/guests.ts). Because guests
#       are on by default the API is "configured" even with no token table,
#       so an anonymous call gets 401, not 503.
#   KONTIER_DEMO_TENANT
#       `token:workspaceId:label` for the one-click demo-tenant sign-in. The
#       token MUST also appear in KONTIER_WORKSPACE_TOKENS or the button hands
#       out a credential the API rejects. Unset ⇒ the button reports 503.
#
#   KONTIER_WORKSPACE_DIR   default /data/workspace (set in the image).
#                           Must stay inside the mounted volume, otherwise the
#                           workspace files vanish on the next redeploy.
#   PORT                    default 3000. Change it here AND in the Dokploy
#                           domain's container port if you move it.
#   NEXT_PUBLIC_SITE_ORIGIN build-time only (metadata/OG URLs), see build.args.
#
# NOT used by this deploy: NEXT_OUTPUT / NEXT_BASE_PATH. They switch
# apps/web/next.config.ts to the static-export (GitHub Pages) mode, which has
# no server and therefore no workspace API. The Dockerfile clears both.
# =============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the bundle at build time (canonical + OG URLs).
        NEXT_PUBLIC_SITE_ORIGIN: ${NEXT_PUBLIC_SITE_ORIGIN:-https://ri.kontier.eu}
    # If you build in CI and push to a registry instead, comment out `build:`
    # and use:
    # image: git.frontieralgorithmics.de/kontier/kontier-ri:latest
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Inside the volume — see the comment block above.
      KONTIER_WORKSPACE_DIR: /data/workspace
      # Left empty on purpose when unset: the API then answers 503 instead of
      # accepting an accidental empty-string token.
      KONTIER_WORKSPACE_TOKENS: ${KONTIER_WORKSPACE_TOKENS:-}
      # "off" disables the unauthenticated guest-workspace endpoint.
      KONTIER_WORKSPACE_GUESTS: ${KONTIER_WORKSPACE_GUESTS:-}
      KONTIER_DEMO_TENANT: ${KONTIER_DEMO_TENANT:-}
    volumes:
      # The whole /data dir, not /data/workspace: the image creates
      # /data/workspace owned by uid 1000 (`node`), so a fresh named volume
      # inherits that ownership and the non-root server can write to it.
      - workspace-data:/data
    # No `ports:` — Traefik reaches the container over dokploy-network. Publish
    # a host port only for local `docker compose up` debugging.
    expose:
      - "3000"
    healthcheck:
      # busybox wget is in the alpine base. "/" is server-rendered by the same
      # process that serves /api/workspace/*, so a 200 here means the Node
      # server is really up (there is no dedicated /api/health route).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot has to JIT the app shell; be generous before marking it sick.
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${KONTIER_RI_MEM_LIMIT:-1G}
        reservations:
          memory: ${KONTIER_RI_MEM_RESERVATION:-256M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Dokploy prefixes this with the compose project name. The dashboards,
  # version snapshots, command log and investigation records of every
  # workspace live here — back it up before destroying the stack.
  workspace-data:

networks:
  # Dokploy's Traefik lives on this network; a compose service is only
  # routable from a UI-configured domain when it joins it. The network is
  # created by Dokploy itself, hence `external: true`.
  default:
    name: dokploy-network
    external: true
